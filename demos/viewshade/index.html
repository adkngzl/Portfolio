<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Viewshade Demo | Angel Adhikari</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="panel">
    <a class="back" href="../../index.html">← Back to portfolio</a>
    <h1>3D Viewshade / Window Visibility Demo</h1>
    <p>
      Public-safe placeholder demo. Replace this scene with your current Three.js viewshade code, GLB model, and window/ray logic.
    </p>
    <div class="controls">
      <label>Ray count <input id="rayCount" type="range" min="24" max="180" value="90" /></label>
      <label>Sun hour <input id="sunHour" type="range" min="6" max="18" value="14" /></label>
      <button id="regen">Regenerate Rays</button>
    </div>
    <p class="hint">Drag to rotate, scroll to zoom. Click the highlighted window point to regenerate rays.</p>
  </div>
  <canvas id="scene"></canvas>

  <script type="module" src="main.js"></script>
</body>
</html>
